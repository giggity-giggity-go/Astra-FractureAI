<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d14">
  <meta name="description" content="Astra FractureAI — AI-assisted X-ray fracture screening demo">
  <link rel="icon" href="/frontend/favicon.png">
  <title>Astra FractureAI</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.11.7/dist/index.css">
  <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css">
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
  <div id="app" v-cloak>
    <header class="topbar">

      <a class="brand" href="/" aria-label="Astra FractureAI home"><img class="brand-mark" src="/frontend/favicon.png" alt="" width="34" height="34" aria-hidden="true"><span><strong>Astra</strong><small>FractureAI</small></span></a>
        <div class="header-actions">
          <span class="status-pill" :class="healthClass" aria-live="polite"><i></i>{{ healthLabel }}</span>
          <el-button circle text @click="openSettings" title="Connection settings" aria-label="Connection settings"><el-icon><setting /></el-icon></el-button>
        </div>
      </header>
      <keep-alive :include="['WorkbenchView']"><component :is="currentView === 'home' ? 'home-view' : 'workbench-view'" ref="workbench" @goto="goto"></component></keep-alive>
      <footer><span>Astra FractureAI · {{ selectedModel || 'Model pending' }}</span><span>AI-assisted screening · Not a substitute for physician diagnosis</span><span><a href="https://www.producthunt.com/posts/astra-fractureai" target="_blank" rel="noopener noreferrer">Product Hunt</a><a href="https://github.com/giggity-giggity-go/Astra-FractureAI" target="_blank" rel="noopener noreferrer">GitHub</a></span></footer>

  </div>

  <script src="https://unpkg.com/vue@3.5.22/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.11.7/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.2/dist/index.iife.min.js"></script>
  <script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
  <script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/frontend/ui-text.js"></script>
  <script src="/frontend/workbench-template.js"></script>
  <script src="/frontend/workbench-view.js"></script>
  <script src="/frontend/app.js"></script>
</body>
</html>
